name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # UTC 22:00 = 北京时间次日 06:00
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GitHub Pages target
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          REPO_LC=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$REPO_LC" != "$OWNER_LC.github.io" ]; then
            echo "::error::当前仓库名为 $REPO_NAME。本站的站内链接使用根路径，请将仓库命名为 $OWNER.github.io 后再部署。"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS feeds
        run: npm run fetch-feeds

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
